<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="emblemHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#3d7eff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="emblemCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#3d7eff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#emblemCoreGlow)" />

  <!-- Outer HUD Caliper Ring -->
  <circle cx="100" cy="100" r="88" stroke="#00e5ff" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="100" cy="100" r="82" stroke="#3d7eff" stroke-width="1.5" stroke-dasharray="24 16 4 16" opacity="0.6" />

  <!-- Outer Technical Hexagon -->
  <polygon points="100,24 166,62 166,138 100,176 34,138 34,62" 
    stroke="url(#emblemHexGrad)" stroke-width="3" fill="#040812" filter="url(#emblemGlow)" />

  <!-- Secondary Concentric Inscribed Hexagon -->
  <polygon points="100,42 150,71 150,129 100,158 50,129 50,71" 
    stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" fill="none" />

  <!-- Coordinate Crosshairs -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
  <line x1="30" y1="100" x2="170" y2="100" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Mechanical Pitch Circle -->
  <circle cx="100" cy="100" r="42" stroke="#3d7eff" stroke-width="2" stroke-dasharray="10 5" />
  <circle cx="100" cy="100" r="26" fill="#00e5ff" opacity="0.18" stroke="#00e5ff" stroke-width="1.8" />
  <circle cx="100" cy="100" r="10" fill="#00e5ff" filter="url(#emblemGlow)" />
  <circle cx="100" cy="100" r="4" fill="#ffffff" />

  <!-- Vernier Calibration Marks -->
  <line x1="100" y1="26" x2="100" y2="36" stroke="#00e5ff" stroke-width="2" />
  <line x1="100" y1="164" x2="100" y2="174" stroke="#00e5ff" stroke-width="2" />
  <line x1="36" y1="100" x2="46" y2="100" stroke="#00e5ff" stroke-width="2" />
  <line x1="154" y1="100" x2="164" y2="100" stroke="#00e5ff" stroke-width="2" />

  <!-- Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M 184 32 L 184 16 L 168 16" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M 16 168 L 16 184 L 32 184" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M 184 168 L 184 184 L 168 184" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7" />
</svg>
