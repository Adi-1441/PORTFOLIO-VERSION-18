<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="logoHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#3d7eff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Technical Caliper Reticle / Hex Mark -->
  <g transform="translate(10, 5)">
    <!-- Outer Hexagon -->
    <polygon points="45,5 80,25 80,65 45,85 10,65 10,25" stroke="url(#logoHexGrad)" stroke-width="2.5" fill="#040812" filter="url(#logoGlow)" />
    
    <!-- Crosshairs -->
    <line x1="45" y1="12" x2="45" y2="78" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.65" />
    <line x1="18" y1="45" x2="72" y2="45" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.65" />
    
    <!-- Pitch Circle Indicator -->
    <circle cx="45" cy="45" r="22" stroke="#3d7eff" stroke-width="1.5" stroke-dasharray="5 3" />
    <circle cx="45" cy="45" r="13" fill="#00e5ff" opacity="0.18" stroke="#00e5ff" stroke-width="1.2" />
    
    <!-- Core Node -->
    <circle cx="45" cy="45" r="4.5" fill="#00e5ff" />

    <!-- Vernier Ticks -->
    <line x1="45" y1="14" x2="45" y2="20" stroke="#00e5ff" stroke-width="1.5" />
    <line x1="45" y1="70" x2="45" y2="76" stroke="#00e5ff" stroke-width="1.5" />
    <line x1="20" y1="45" x2="26" y2="45" stroke="#00e5ff" stroke-width="1.5" />
    <line x1="64" y1="45" x2="70" y2="45" stroke="#00e5ff" stroke-width="1.5" />
  </g>

  <!-- Typography: ADITHYA MECHNEXUS -->
  <g transform="translate(112, 10)">
    <!-- Pre-title / Discipline Telemetry -->
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#00e5ff" letter-spacing="0.25em">
      SYSTEM: DIGITAL ENGINEERING CORE
    </text>

    <!-- Main Wordmark -->
    <text x="0" y="48" font-family="'Orbitron', -apple-system, sans-serif" font-size="24" font-weight="900" fill="url(#logoTextGrad)" letter-spacing="0.14em">
      ADITHYA MECHNEXUS
    </text>

    <!-- Subtitle / Title -->
    <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="0.18em">
      MECHANICAL ENGINEERING // MULTI-PHYSICS
    </text>

    <!-- Baseline Technical Calibration Line -->
    <line x1="0" y1="78" x2="280" y2="78" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="78" x2="70" y2="78" stroke="#00e5ff" stroke-width="1.5" />
    <circle cx="70" cy="78" r="2" fill="#00e5ff" />
  </g>
</svg>
