<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#3d7eff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Technical Outer Hexagon -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#gearGrad)" stroke-width="2.5" fill="#060b14" filter="url(#glow)" />
  <!-- Caliper Grid Crosshairs -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="18" y1="50" x2="82" y2="50" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
  <!-- Mechanical Core Pitch Circle -->
  <circle cx="50" cy="50" r="24" stroke="#3d7eff" stroke-width="1.8" stroke-dasharray="6 3" />
  <circle cx="50" cy="50" r="14" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="1.5" />
  <circle cx="50" cy="50" r="5" fill="#00e5ff" />
  <!-- Precision Vernier Marks -->
  <line x1="50" y1="16" x2="50" y2="22" stroke="#00e5ff" stroke-width="1.5" />
  <line x1="50" y1="78" x2="50" y2="84" stroke="#00e5ff" stroke-width="1.5" />
  <line x1="22" y1="50" x2="28" y2="50" stroke="#00e5ff" stroke-width="1.5" />
  <line x1="72" y1="50" x2="78" y2="50" stroke="#00e5ff" stroke-width="1.5" />
</svg>
